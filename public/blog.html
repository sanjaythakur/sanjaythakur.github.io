  <style>
    .blog {
      padding: 70px 0 8px;
    }
    .blog__head {
      margin-bottom: 36px;
    }
    .blog__label {
      font-size: 12.5px;
      color: var(--muted);
      letter-spacing: 1.5px;
      margin: 0 0 14px;
    }
    .blog__title {
      font-size: clamp(28px, 4.4vw, 42px);
      font-weight: 600;
      letter-spacing: 2px;
      margin: 0 0 10px;
    }
    .blog__subtitle {
      color: var(--muted);
      font-size: 14.5px;
      margin: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      padding: 10px 14px;
      flex: 1;
      min-width: 240px;
      max-width: 420px;
      transition: border-color 0.25s var(--ease);
    }
    .search:focus-within {
      border-color: var(--accent);
    }
    .search span {
      color: var(--accent);
    }
    .search input {
      flex: 1;
      background: none;
      border: 0;
      outline: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
    }
    .search input::placeholder {
      color: var(--muted);
    }
    #filterInfo {
      font-size: 12.5px;
      color: var(--muted);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }
    .chip {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--muted);
      border: 1px solid var(--border);
      background: transparent;
      padding: 7px 14px;
      cursor: pointer;
      transition: 0.22s var(--ease);
    }
    .chip:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }
    .chip.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .post-card {
      display: block;
      padding: 26px 4px;
      border-top: 1px solid var(--border);
      transition: background 0.25s var(--ease), padding 0.25s var(--ease),
        transform 0.25s var(--ease);
    }
    .posts-list .post-card:last-child {
      border-bottom: 1px solid var(--border);
    }
    .post-card:hover {
      background: var(--bg-soft);
      padding-left: 16px;
      transform: translateY(-2px);
    }
    .post-card__meta {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .post-card__cat {
      color: var(--accent);
      text-transform: lowercase;
    }
    .post-card__title {
      font-size: 19px;
      font-weight: 500;
      color: var(--text);
      margin: 0 0 10px;
      line-height: 1.35;
    }
    .post-card__excerpt {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
      margin: 0 0 14px;
      max-width: 78ch;
    }
    .post-card__more {
      font-size: 13px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 0.25s var(--ease);
    }
    .post-card:hover .post-card__more {
      color: var(--accent);
    }
    .post-card__more .arrow {
      transition: transform 0.25s var(--ease);
    }
    .post-card:hover .post-card__more .arrow {
      transform: translateX(4px);
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 40px;
    }
    .pagination button {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      padding: 8px 13px;
      cursor: pointer;
      transition: 0.22s var(--ease);
    }
    .pagination button:hover:not(:disabled) {
      color: var(--text);
      border-color: var(--border-strong);
    }
    .pagination button.active {
      color: var(--accent);
      border-color: var(--accent);
    }
    .pagination button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .no-results {
      padding: 60px 0;
      text-align: center;
      color: var(--muted);
    }
    #loading {
      color: var(--muted);
      padding: 30px 0;
    }
  </style>
</head>

  <script src="blogData.js"></script>
  <script>
    (function () {
      var nav = document.getElementById("nav");
      var toggle = document.getElementById("navToggle");
      var links = document.getElementById("navLinks");
      if (toggle) {
        toggle.addEventListener("click", function () {
          nav.classList.toggle("is-open");
          links.classList.toggle("is-open");
        });
      }
      document.querySelectorAll(".reveal").forEach(function (el) {
        el.classList.add("is-in");
      });
    })();

    var allPosts = [];
    var filteredPosts = [];
    var currentPage = 1;
    var postsPerPage = 6;
    var currentCategory = "all";
    var searchQuery = "";

    function createPostHTML(post) {
      return (
        '<a class="post-card" href="' + post.file + '">' +
        '<div class="post-card__meta">' +
        '<span class="post-card__cat">' + post.category.toLowerCase() + "</span>" +
        "<span>" + post.date + "</span>" +
        "</div>" +
        '<h3 class="post-card__title">' + post.title + "</h3>" +
        '<p class="post-card__excerpt">' + post.excerpt + "</p>" +
        '<span class="post-card__more">continue reading <span class="arrow">&rarr;</span></span>' +
        "</a>"
      );
    }

    function displayPosts() {
      var container = document.getElementById("posts-list");
      var start = (currentPage - 1) * postsPerPage;
      var toShow = filteredPosts.slice(start, start + postsPerPage);
      container.innerHTML = "";
      if (filteredPosts.length === 0) {
        container.innerHTML =
          '<div class="no-results">no posts found &mdash; try a different search or filter.</div>';
        updateFilterInfo();
        return;
      }
      toShow.forEach(function (post) {
        container.innerHTML += createPostHTML(post);
      });
      updateFilterInfo();
    }

    function setupPagination() {
      var container = document.getElementById("pagination");
      var totalPages = Math.ceil(filteredPosts.length / postsPerPage);
      container.innerHTML = "";
      if (totalPages <= 1) return;

      var prev = document.createElement("button");
      prev.textContent = "prev";
      prev.disabled = currentPage === 1;
      prev.addEventListener("click", function () {
        if (currentPage > 1) { currentPage--; displayPosts(); setupPagination(); window.scrollTo(0, 0); }
      });
      container.appendChild(prev);

      for (var i = 1; i <= totalPages; i++) {
        (function (page) {
          var b = document.createElement("button");
          b.textContent = page;
          b.className = page === currentPage ? "active" : "";
          b.addEventListener("click", function () {
            currentPage = page; displayPosts(); setupPagination(); window.scrollTo(0, 0);
          });
          container.appendChild(b);
        })(i);
      }

      var next = document.createElement("button");
      next.textContent = "next";
      next.disabled = currentPage === totalPages;
      next.addEventListener("click", function () {
        if (currentPage < totalPages) { currentPage++; displayPosts(); setupPagination(); window.scrollTo(0, 0); }
      });
      container.appendChild(next);
    }

    function filterPosts() {
      filteredPosts = allPosts.filter(function (post) {
        var q = searchQuery.toLowerCase();
        var matchesSearch =
          q === "" ||
          post.title.toLowerCase().includes(q) ||
          post.excerpt.toLowerCase().includes(q) ||
          post.category.toLowerCase().includes(q);
        var matchesCat = currentCategory === "all" || post.category === currentCategory;
        return matchesSearch && matchesCat;
      });
      currentPage = 1;
    }

    function updateFilterInfo() {
      var el = document.getElementById("filterInfo");
      if (searchQuery !== "" || currentCategory !== "all") {
        var txt = "showing " + filteredPosts.length + " of " + allPosts.length + " posts";
        if (currentCategory !== "all") txt += " in " + currentCategory.toLowerCase();
        el.textContent = txt;
      } else {
        el.textContent = allPosts.length + " posts";
      }
    }

    function setupCategoryFilters() {
      var categories = ["all"];
      allPosts.forEach(function (p) {
        if (categories.indexOf(p.category) === -1) categories.push(p.category);
      });
      var container = document.getElementById("category-filters");
      container.innerHTML = "";
      categories.forEach(function (category) {
        var chip = document.createElement("button");
        chip.className = "chip" + (category === currentCategory ? " active" : "");
        chip.textContent = category === "all" ? "all" : category.toLowerCase();
        chip.addEventListener("click", function () {
          currentCategory = category;
          document.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("active"); });
          chip.classList.add("active");
          filterPosts(); displayPosts(); setupPagination();
        });
        container.appendChild(chip);
      });
    }

    function initSearch() {
      var input = document.getElementById("search-input");
      input.addEventListener("input", function () {
        searchQuery = input.value.trim();
        filterPosts(); displayPosts(); setupPagination();
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      allPosts = sortPostsByDate(blogPosts);
      filteredPosts = allPosts.slice();
      initSearch();
      setupCategoryFilters();
      displayPosts();
      setupPagination();
    });
  </script>
